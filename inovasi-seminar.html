<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Struktur Data & Algoritma - Game Interaktif untuk Kelas 10 SMK</title>
    <style>
        :root {
            --bg: #f0f4f8;
            --card: #ffffff;
            --primary: #4f46e5;
            --array: #3b82f6;
            --stack: #f97316;
            --queue: #10b981;
            --list: #8b5cf6;
            --linear: #ef4444;
            --binary: #6366f1;
            --bubble: #ec4899;
            --selection: #eab308;
            --text: #1e293b;
            --sub: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.07);
            --radius: 18px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #e8eef5 0%, #f0f4f8 30%, #fdf2f8 70%, #fefce8 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text);
            line-height: 1.6;
        }

        /* HEADER */
        .header {
            background: white;
            padding: 18px 30px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
            position: sticky;
            top: 0;
            z-index: 100;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }
        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4f46e5, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        .header .subtitle {
            font-size: 0.85rem;
            color: var(--sub);
            margin-top: 2px;
        }

        /* NAV TABS */
        .nav-container {
            max-width: 1100px;
            margin: 20px auto 0;
            padding: 0 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .nav-tab {
            padding: 10px 16px;
            border-radius: 30px;
            border: 2px solid var(--border);
            background: white;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: var(--transition);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
            color: var(--text);
        }
        .nav-tab:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
            border-color: #c4b5fd;
        }
        .nav-tab.active {
            color: white;
            border-color: transparent;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }
        .nav-tab.array-tab.active { background: var(--array); }
        .nav-tab.stack-tab.active { background: var(--stack); }
        .nav-tab.queue-tab.active { background: var(--queue); }
        .nav-tab.list-tab.active { background: var(--list); }
        .nav-tab.linear-tab.active { background: var(--linear); }
        .nav-tab.binary-tab.active { background: var(--binary); }
        .nav-tab.bubble-tab.active { background: var(--bubble); }
        .nav-tab.selection-tab.active { background: var(--selection); color: #1e293b; }
        .nav-tab .emoji { font-size: 1.2rem; }

        /* MAIN CONTENT */
        .main-container {
            max-width: 1000px;
            margin: 24px auto 60px;
            padding: 0 16px;
        }
        .section { display: none; animation: fadeSlideIn 0.4s ease; }
        .section.active { display: block; }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: white;
            border-radius: var(--radius);
            padding: 28px 30px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        .card h3 {
            font-size: 1.3rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card .desc {
            color: var(--sub);
            font-size: 0.9rem;
            margin-bottom: 18px;
            line-height: 1.5;
        }
        .card .rule-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        .badge-lifo { background: #fff7ed; color: #ea580c; }
        .badge-fifo { background: #ecfdf5; color: #059669; }
        .badge-info { background: #eff6ff; color: #2563eb; }

        /* GAME AREA */
        .game-area {
            background: #fafbfc;
            border-radius: 14px;
            padding: 20px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            border: 2px dashed #e2e8f0;
            position: relative;
        }
        .game-area.compact { min-height: 120px; padding: 14px; }

        /* ARRAY - Rak Sepatu */
        .rak-sepatu { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: flex-end; }
        .slot-sepatu {
            width: 90px; height: 110px;
            border: 3px solid #cbd5e1;
            border-radius: 12px 12px 6px 6px;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            cursor: pointer; transition: var(--transition);
            background: #f8fafc; position: relative; overflow: hidden;
            font-weight: 600; font-size: 0.8rem; padding-bottom: 8px;
        }
        .slot-sepatu:hover { border-color: var(--array); box-shadow: 0 4px 16px rgba(59, 130, 246, 0.2); transform: translateY(-4px); }
        .slot-sepatu.filled { background: #dbeafe; border-color: var(--array); border-style: solid; }
        .slot-sepatu .slot-index { position: absolute; top: 6px; left: 10px; font-size: 0.7rem; color: #94a3b8; font-weight: 700; }
        .slot-sepatu .sepatu-emoji { font-size: 2.4rem; transition: var(--transition); margin-bottom: 2px; }
        .slot-sepatu .sepatu-nama { font-size: 0.7rem; color: #475569; }
        .slot-sepatu.filled .sepatu-emoji { animation: bounceIn 0.5s ease; }
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* STACK - Tumpukan Piring */
        .tumpukan-piring {
            display: flex; flex-direction: column-reverse; align-items: center;
            gap: 0; min-height: 200px; justify-content: flex-start; position: relative;
        }
        .piring {
            width: 100px; height: 40px;
            background: linear-gradient(180deg, #fff 0%, #fef3c7 40%, #fde68a 100%);
            border: 3px solid #f59e0b; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; font-weight: 700; color: #92400e;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            position: relative; z-index: 1;
        }
        .piring.entering { animation: dropIn 0.4s ease forwards; }
        .piring.leaving { animation: popOut 0.35s ease forwards; }
        @keyframes dropIn { from { transform: translateY(-60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes popOut { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-60px); opacity: 0; } }
        .meja-stack { width: 160px; height: 12px; background: #78716c; border-radius: 6px; margin-top: 2px; }

        /* QUEUE - Antrian */
        .antrian-area {
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
            min-height: 80px; padding: 10px; background: #f0fdf4; border-radius: 12px;
            width: 100%; position: relative;
        }
        .orang-antri {
            width: 55px; height: 65px;
            background: #d1fae5; border: 2px solid #10b981; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; transition: all 0.4s ease; position: relative; font-weight: 700;
        }
        .orang-antri.entering { animation: slideInRight 0.4s ease forwards; }
        .orang-antri.leaving { animation: slideOutLeft 0.4s ease forwards; }
        @keyframes slideInRight { from { transform: translateX(60px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOutLeft { from { transform: translateX(0); opacity: 1; } to { transform: translateX(-60px); opacity: 0; } }
        .kasir-marker { font-size: 1.5rem; padding: 6px 14px; background: #fef3c7; border-radius: 20px; font-weight: 700; border: 2px solid #f59e0b; white-space: nowrap; }

        /* LIST - Daftar Belanja */
        .list-belanja { list-style: none; width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 8px; }
        .list-item {
            display: flex; align-items: center; justify-content: space-between;
            background: #f5f3ff; border: 2px solid #c4b5fd; border-radius: 10px;
            padding: 10px 16px; transition: var(--transition); font-weight: 500;
            cursor: default; animation: fadeSlideIn 0.3s ease;
        }
        .list-item:hover { background: #ede9fe; }
        .list-item .item-num { font-weight: 700; color: var(--list); margin-right: 8px; }
        .list-item .hapus-btn {
            background: #fee2e2; border: none; color: #dc2626; cursor: pointer;
            border-radius: 50%; width: 28px; height: 28px;
            font-weight: 700; font-size: 0.9rem; transition: var(--transition);
            display: flex; align-items: center; justify-content: center;
        }
        .list-item .hapus-btn:hover { background: #fecaca; transform: scale(1.1); }

        /* LINEAR SEARCH */
        .tas-area { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 10px; }
        .barang-tas {
            width: 75px; height: 75px; border-radius: 14px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 3px solid #e2e8f0; background: #f8fafc;
            transition: all 0.4s ease; cursor: default;
            font-weight: 600; font-size: 0.7rem; text-align: center;
        }
        .barang-tas.checking { border-color: #f59e0b; background: #fffbeb; animation: shake 0.5s ease; box-shadow: 0 0 0 6px rgba(245, 158, 11, 0.25); }
        .barang-tas.found { border-color: #10b981; background: #d1fae5; box-shadow: 0 0 0 8px rgba(16, 185, 129, 0.3); animation: bounceIn 0.5s ease; }
        .barang-tas.discarded { opacity: 0.35; border-style: dashed; transform: scale(0.9); }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        /* BINARY SEARCH */
        .binary-array { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
        .binary-cell {
            width: 48px; height: 48px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 0.85rem;
            border: 2px solid #e2e8f0; background: #f8fafc;
            transition: all 0.35s ease;
        }
        .binary-cell.in-range { background: #eff6ff; border-color: #93c5fd; }
        .binary-cell.mid { background: #fef3c7; border-color: #f59e0b; box-shadow: 0 0 0 5px rgba(245, 158, 11, 0.3); animation: pulse 0.7s ease infinite; font-size: 1rem; }
        .binary-cell.out-range { opacity: 0.25; }
        .binary-cell.found-cell { background: #d1fae5; border-color: #10b981; box-shadow: 0 0 0 6px rgba(16, 185, 129, 0.3); animation: bounceIn 0.5s ease; }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 5px rgba(245, 158, 11, 0.3); }
            50% { box-shadow: 0 0 0 14px rgba(245, 158, 11, 0.05); }
        }

        /* SORTING */
        .sort-bars { display: flex; gap: 8px; align-items: flex-end; justify-content: center; height: 200px; padding: 10px; }
        .sort-bar {
            width: 55px; border-radius: 10px 10px 4px 4px;
            display: flex; align-items: flex-end; justify-content: center;
            padding-bottom: 8px; font-weight: 700; color: white; font-size: 0.9rem;
            transition: all 0.4s ease; cursor: default;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        .sort-bar.comparing { box-shadow: 0 0 0 6px rgba(245, 158, 11, 0.5); transform: translateY(-10px); z-index: 2; }
        .sort-bar.swapping { animation: swapBounce 0.5s ease; }
        .sort-bar.sorted { box-shadow: 0 0 0 5px rgba(16, 185, 129, 0.4); border: 2px solid #10b981; }
        @keyframes swapBounce {
            0%, 100% { transform: translateY(0); }
            30% { transform: translateY(-20px); }
            60% { transform: translateY(-6px); }
        }

        /* BUTTONS */
        .btn {
            padding: 10px 20px; border-radius: 25px; border: none; cursor: pointer;
            font-weight: 600; font-size: 0.9rem; transition: var(--transition);
            display: inline-flex; align-items: center; gap: 6px; font-family: inherit;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15); }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: white; border: 2px solid #cbd5e1; color: #475569; }
        .btn-sm { padding: 6px 14px; font-size: 0.8rem; border-radius: 20px; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-array { background: var(--array); color: white; }
        .btn-stack { background: var(--stack); color: white; }
        .btn-queue { background: var(--queue); color: white; }
        .btn-list { background: var(--list); color: white; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .input-sm {
            padding: 8px 14px; border-radius: 20px; border: 2px solid #e2e8f0;
            font-family: inherit; font-size: 0.85rem; width: 140px;
            text-align: center; transition: var(--transition);
        }
        .input-sm:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }

        /* STATUS */
        .status-msg {
            font-weight: 600; font-size: 0.9rem;
            padding: 8px 16px; border-radius: 20px; text-align: center;
            min-height: 36px; display: flex; align-items: center; gap: 6px;
        }
        .status-msg.success { background: #ecfdf5; color: #059669; }
        .status-msg.info { background: #eff6ff; color: #2563eb; }
        .status-msg.warning { background: #fffbeb; color: #d97706; }

        /* TOOLTIP */
        .info-pop { position: relative; cursor: help; }
        .info-pop:hover::after {
            content: attr(data-tip); position: absolute; bottom: 120%; left: 50%;
            transform: translateX(-50%); background: #1e293b; color: #fff;
            padding: 6px 12px; border-radius: 8px; font-size: 0.75rem;
            white-space: nowrap; z-index: 10; pointer-events: none;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .header h1 { font-size: 1.2rem; }
            .nav-tab { font-size: 0.75rem; padding: 8px 11px; border-radius: 22px; }
            .card { padding: 16px; }
            .sort-bar { width: 38px; font-size: 0.7rem; }
            .sort-bars { height: 140px; gap: 4px; }
            .slot-sepatu { width: 60px; height: 80px; font-size: 0.65rem; }
            .slot-sepatu .sepatu-emoji { font-size: 1.6rem; }
            .binary-cell { width: 34px; height: 34px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <h1>🎮 Struktur Data & Algoritma</h1>
        <div class="subtitle">Game Interaktif untuk Kelas 10 SMK · Paham dari Nol!</div>
    </div>

    <!-- NAVIGATION TABS -->
    <div class="nav-container" id="navContainer">
        <button class="nav-tab array-tab active" data-section="array"><span class="emoji">👟</span> Array</button>
        <button class="nav-tab stack-tab" data-section="stack"><span class="emoji">🍽️</span> Stack</button>
        <button class="nav-tab queue-tab" data-section="queue"><span class="emoji">🧑‍🤝‍🧑</span> Queue</button>
        <button class="nav-tab list-tab" data-section="list"><span class="emoji">📋</span> List</button>
        <button class="nav-tab linear-tab" data-section="linear"><span class="emoji">🔍</span> Linear Search</button>
        <button class="nav-tab binary-tab" data-section="binary"><span class="emoji">📖</span> Binary Search</button>
        <button class="nav-tab bubble-tab" data-section="bubble"><span class="emoji">🫧</span> Bubble Sort</button>
        <button class="nav-tab selection-tab" data-section="selection"><span class="emoji">🃏</span> Selection Sort</button>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-container">

        <!-- ==================== ARRAY ==================== -->
        <div class="section active" id="section-array">
            <div class="card">
                <h3>👟 Array — Rak Sepatu Bernomor</h3>
                <p class="desc">Array adalah kumpulan data <strong>berurutan</strong> dengan <strong>indeks mulai dari 0</strong>. Jumlah slot-nya <strong>tetap (fixed)</strong>. Seperti rak sepatu: kamu langsung tahu sepatu ada di slot nomor berapa!</p>
                <span class="rule-badge badge-info">🔢 Indeks: 0, 1, 2, 3, 4</span>
                <div class="game-area" id="arrayGame">
                    <div class="rak-sepatu" id="rakSepatu"></div>
                    <div class="status-msg info" id="arrayStatus">👆 Klik slot kosong untuk menaruh sepatu, klik slot terisi untuk mengambilnya.</div>
                    <div class="btn-group">
                        <button class="btn btn-array btn-sm" onclick="isiSemuaSlot()">📥 Isi Semua Slot</button>
                        <button class="btn btn-outline btn-sm" onclick="resetArray()">🔄 Kosongkan Rak</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== STACK ==================== -->
        <div class="section" id="section-stack">
            <div class="card">
                <h3>🍽️ Stack — Tumpukan Piring (LIFO)</h3>
                <p class="desc"><strong>Last In, First Out.</strong> Piring yang <strong>terakhir ditumpuk</strong> akan <strong>pertama diambil</strong>. Bayangkan tumpukan piring di kantin — piring paling atas selalu diambil duluan!</p>
                <span class="rule-badge badge-lifo">📌 LIFO — Last In First Out</span>
                <div class="game-area" id="stackGame">
                    <div class="tumpukan-piring" id="tumpukanPiring"></div>
                    <div class="meja-stack"></div>
                    <div class="status-msg info" id="stackStatus">🍽️ Klik PUSH untuk menambah piring, POP untuk mengambil piring paling atas.</div>
                    <div class="btn-group">
                        <button class="btn btn-stack" onclick="pushPiring()">⬆️ PUSH (Tambah Piring)</button>
                        <button class="btn btn-outline" onclick="popPiring()">⬇️ POP (Ambil Piring Atas)</button>
                        <button class="btn btn-outline btn-sm" onclick="resetStack()">🔄 Reset</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== QUEUE ==================== -->
        <div class="section" id="section-queue">
            <div class="card">
                <h3>🧑‍🤝‍🧑 Queue — Antrian Kasir (FIFO)</h3>
                <p class="desc"><strong>First In, First Out.</strong> Orang yang <strong>datang pertama</strong> akan <strong>dilayani pertama</strong>. Seperti antrian di Indomaret — tidak boleh nyerobot!</p>
                <span class="rule-badge badge-fifo">📌 FIFO — First In First Out</span>
                <div class="game-area" id="queueGame">
                    <div style="display:flex;align-items:center;gap:12px;width:100%;justify-content:center;flex-wrap:wrap;">
                        <span class="kasir-marker">🛒 Kasir</span>
                        <div class="antrian-area" id="antrianArea"></div>
                    </div>
                    <div class="status-msg info" id="queueStatus">🚶 Orang datang = ENQUEUE (masuk belakang), dilayani = DEQUEUE (depan keluar).</div>
                    <div class="btn-group">
                        <button class="btn btn-queue" onclick="enqueueOrang()">➕ ENQUEUE (Orang Datang)</button>
                        <button class="btn btn-outline" onclick="dequeueOrang()">✅ DEQUEUE (Layani Depan)</button>
                        <button class="btn btn-outline btn-sm" onclick="resetQueue()">🔄 Reset</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== LIST ==================== -->
        <div class="section" id="section-list">
            <div class="card">
                <h3>📋 List — Daftar Belanja Fleksibel</h3>
                <p class="desc">List itu seperti Array tapi <strong>ukurannya bisa berubah</strong>. Kamu bebas <strong>menambah, menyisipkan, atau menghapus</strong> data di posisi mana saja!</p>
                <span class="rule-badge badge-info">✨ Fleksibel — Bisa bertambah, menyusut, disisipkan</span>
                <div class="game-area" id="listGame">
                    <ul class="list-belanja" id="listBelanja"></ul>
                    <div class="status-msg info" id="listStatus">📝 Tambahkan item ke daftar belanja, klik ❌ untuk menghapus.</div>
                    <div class="btn-group" style="flex-wrap:wrap;">
                        <input type="text" class="input-sm" id="listInput" placeholder="Nama item..." maxlength="20">
                        <button class="btn btn-list btn-sm" onclick="tambahItemList('akhir')">➕ Tambah di Akhir</button>
                        <input type="number" class="input-sm" id="listPosInput" placeholder="Posisi (1,2...)" min="1" style="width:100px;">
                        <button class="btn btn-outline btn-sm" onclick="tambahItemList('sisip')">📌 Sisipkan di Posisi</button>
                        <button class="btn btn-outline btn-sm" onclick="resetList()">🔄 Reset</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== LINEAR SEARCH ==================== -->
        <div class="section" id="section-linear">
            <div class="card">
                <h3>🔍 Linear Search — Cari Satu per Satu</h3>
                <p class="desc">Cara paling sederhana: <strong>cek satu per satu</strong> dari awal sampai ketemu. Data <strong>tidak perlu diurutkan</strong>. Seperti mencari kunci motor di tas ransel yang gelap — keluarkan barang satu per satu!</p>
                <span class="rule-badge badge-info">🎯 Target: Kunci Motor 🔑</span>
                <div class="game-area" id="linearGame">
                    <div class="tas-area" id="tasArea"></div>
                    <div class="status-msg info" id="linearStatus">🔍 Klik "Cari Satu per Satu" untuk mulai mencari Kunci Motor di dalam tas.</div>
                    <div class="btn-group">
                        <button class="btn btn-primary" id="btnLinearStep" onclick="linearSearchStep()">👆 Cari Satu per Satu (Step)</button>
                        <button class="btn btn-outline btn-sm" onclick="resetLinearSearch()">🔄 Acak Ulang Tas</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== BINARY SEARCH ==================== -->
        <div class="section" id="section-binary">
            <div class="card">
                <h3>📖 Binary Search — Cari Bagi Dua</h3>
                <p class="desc"><strong>Syarat: Data HARUS terurut!</strong> Caranya dengan <strong>membagi dua</strong> data terus-menerus, lalu membuang setengah yang tidak mungkin. Seperti mencari kata di kamus tebal — buka tengah, lihat hurufnya, buang setengah!</p>
                <span class="rule-badge badge-info">⚠️ Syarat Mutlak: Data harus terurut (kecil → besar)</span>
                <div class="game-area" id="binaryGame">
                    <div class="binary-array" id="binaryArray"></div>
                    <div class="status-msg info" id="binaryStatus">🎯 Pilih angka target lalu klik "Langkah Binary Search" untuk mencari.</div>
                    <div class="btn-group">
                        <input type="number" class="input-sm" id="binaryTarget" placeholder="Target (1-31)" min="1" max="31">
                        <button class="btn btn-primary btn-sm" onclick="initBinarySearch()">🎯 Set Target & Cari</button>
                        <button class="btn btn-outline btn-sm" id="btnBinaryStep" onclick="binarySearchStep()" disabled>📖 Langkah Berikutnya</button>
                        <button class="btn btn-outline btn-sm" onclick="resetBinarySearch()">🔄 Reset</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== BUBBLE SORT ==================== -->
        <div class="section" id="section-bubble">
            <div class="card">
                <h3>🫧 Bubble Sort — Pengurutan Gelembung</h3>
                <p class="desc">Bandingkan <strong>dua data bersebelahan</strong>, jika urutannya salah → <strong>tukar</strong>. Nilai terbesar akan <strong>"menggelembung"</strong> ke posisi paling akhir. Ulangi sampai semua terurut!</p>
                <span class="rule-badge badge-info">🫧 Nilai terbesar naik seperti gelembung ke permukaan</span>
                <div class="game-area" id="bubbleGame">
                    <div class="sort-bars" id="bubbleBars"></div>
                    <div class="status-msg info" id="bubbleStatus">🫧 Klik "Langkah" untuk melihat proses Bubble Sort. Bandingkan tetangga, tukar jika perlu!</div>
                    <div class="btn-group">
                        <button class="btn btn-primary btn-sm" id="btnBubbleStep" onclick="bubbleSortStep()">👆 Langkah Berikutnya</button>
                        <button class="btn btn-outline btn-sm" id="btnBubbleAuto" onclick="bubbleSortAuto()">▶️ Auto Play</button>
                        <button class="btn btn-outline btn-sm" onclick="resetBubbleSort()">🔄 Acak Ulang</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== SELECTION SORT ==================== -->
        <div class="section" id="section-selection">
            <div class="card">
                <h3>🃏 Selection Sort — Pengurutan Pilih Langsung</h3>
                <p class="desc">Cari <strong>nilai terkecil</strong> di antara data yang tersisa, lalu <strong>taruh di posisi paling depan</strong> dari sisa tersebut. Lebih hemat langkah karena langsung memilih yang terkecil!</p>
                <span class="rule-badge badge-info">🎯 Cari terkecil → taruh di depan → ulangi</span>
                <div class="game-area" id="selectionGame">
                    <div class="sort-bars" id="selectionBars"></div>
                    <div class="status-msg info" id="selectionStatus">🃏 Klik "Langkah" untuk melihat proses Selection Sort. Cari yang terkecil, taruh di depan!</div>
                    <div class="btn-group">
                        <button class="btn btn-primary btn-sm" id="btnSelectionStep" onclick="selectionSortStep()">👆 Langkah Berikutnya</button>
                        <button class="btn btn-outline btn-sm" id="btnSelectionAuto" onclick="selectionSortAuto()">▶️ Auto Play</button>
                        <button class="btn btn-outline btn-sm" onclick="resetSelectionSort()">🔄 Acak Ulang</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ==================== NAVIGATION ====================
        const navTabs = document.querySelectorAll('.nav-tab');
        const sections = document.querySelectorAll('.section');

        navTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const sectionId = tab.getAttribute('data-section');
                navTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                sections.forEach(s => s.classList.remove('active'));
                document.getElementById('section-' + sectionId).classList.add('active');
                if (sectionId === 'array') renderArray();
                if (sectionId === 'stack') renderStack();
                if (sectionId === 'queue') renderQueue();
                if (sectionId === 'list') renderList();
                if (sectionId === 'linear') renderLinearSearch();
                if (sectionId === 'binary') renderBinarySearch();
                if (sectionId === 'bubble') renderBubbleSort();
                if (sectionId === 'selection') renderSelectionSort();
            });
        });

        // ==================== ARRAY GAME ====================
        const sepatuOptions = [
            { emoji: '👟', nama: 'Kets' },
            { emoji: '👞', nama: 'Sekolah' },
            { emoji: '🩴', nama: 'Sandal' },
            { emoji: '⚽', nama: 'Futsal' },
            { emoji: '🥾', nama: 'Gunung' },
            { emoji: '👠', nama: 'Hak Tinggi' },
            { emoji: '🩰', nama: 'Balet' },
            { emoji: '👢', nama: 'Boot' },
        ];
        let arraySlots = [null, null, null, null, null];

        function renderArray() {
            const rak = document.getElementById('rakSepatu');
            rak.innerHTML = '';
            arraySlots.forEach((isi, idx) => {
                const slot = document.createElement('div');
                slot.className = 'slot-sepatu' + (isi !== null ? ' filled' : '');
                slot.innerHTML = `
                    <span class="slot-index">[${idx}]</span>
                    <span class="sepatu-emoji">${isi ? isi.emoji : '❓'}</span>
                    <span class="sepatu-nama">${isi ? isi.nama : 'Kosong'}</span>
                `;
                slot.addEventListener('click', () => handleSlotClick(idx));
                rak.appendChild(slot);
            });
            updateArrayStatus();
        }

        function handleSlotClick(idx) {
            if (arraySlots[idx] !== null) {
                const diambil = arraySlots[idx];
                arraySlots[idx] = null;
                document.getElementById('arrayStatus').textContent =
                    `📤 Mengambil "${diambil.nama}" dari slot [${idx}]. Slot jadi kosong.`;
                document.getElementById('arrayStatus').className = 'status-msg warning';
            } else {
                const randomSepatu = sepatuOptions[Math.floor(Math.random() * sepatuOptions.length)];
                const sudahAda = arraySlots.some(s => s && s.nama === randomSepatu.nama);
                const pilihan = sudahAda ?
                    sepatuOptions.find(s => !arraySlots.some(as => as && as.nama === s.nama)) || randomSepatu :
                    randomSepatu;
                arraySlots[idx] = pilihan;
                document.getElementById('arrayStatus').textContent =
                    `📥 Menaruh "${pilihan.nama}" ${pilihan.emoji} di slot [${idx}]. Indeks ke-${idx}.`;
                document.getElementById('arrayStatus').className = 'status-msg success';
            }
            renderArray();
        }

        function updateArrayStatus() {
            const terisi = arraySlots.filter(s => s !== null).length;
            if (terisi === 0) {
                document.getElementById('arrayStatus').textContent =
                '👆 Klik slot kosong untuk menaruh sepatu, klik slot terisi untuk mengambilnya.';
                document.getElementById('arrayStatus').className = 'status-msg info';
            }
        }

        function isiSemuaSlot() {
            const available = [...sepatuOptions];
            for (let i = 0; i < 5; i++) {
                if (arraySlots[i] === null) {
                    const pick = available.find(s => !arraySlots.some(as => as && as.nama === s.nama));
                    if (pick) {
                        arraySlots[i] = pick;
                    } else {
                        arraySlots[i] = available[i % available.length];
                    }
                }
            }
            document.getElementById('arrayStatus').textContent = '✅ Semua slot terisi! Coba klik slot untuk mengambil sepatu.';
            document.getElementById('arrayStatus').className = 'status-msg success';
            renderArray();
        }

        function resetArray() {
            arraySlots = [null, null, null, null, null];
            document.getElementById('arrayStatus').textContent =
            '🔄 Rak dikosongkan. Klik slot untuk menaruh sepatu.';
            document.getElementById('arrayStatus').className = 'status-msg info';
            renderArray();
        }

        // ==================== STACK GAME ====================
        let stackData = [];
        let stackCounter = 1;

        function renderStack() {
            const container = document.getElementById('tumpukanPiring');
            container.innerHTML = '';
            stackData.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = 'piring';
                div.textContent = '🍽️ ' + p;
                div.style.marginBottom = '-8px';
                container.appendChild(div);
            });
            document.getElementById('stackStatus').textContent =
                stackData.length === 0 ?
                '🍽️ Tumpukan kosong. Klik PUSH untuk menambah piring.' :
                `📌 Piring paling atas: #${stackData[stackData.length-1]}. Ada ${stackData.length} piring di tumpukan.`;
            document.getElementById('stackStatus').className = stackData.length === 0 ? 'status-msg info' :
                'status-msg success';
        }

        function pushPiring() {
            const newPiring = stackCounter++;
            stackData.push(newPiring);
            renderStack();
            const container = document.getElementById('tumpukanPiring');
            const lastChild = container.lastElementChild;
            if (lastChild) {
                lastChild.classList.add('entering');
                setTimeout(() => lastChild.classList.remove('entering'), 400);
            }
            document.getElementById('stackStatus').textContent =
                `⬆️ PUSH: Piring #${newPiring} ditaruh di ATAS tumpukan. (LIFO!)`;
            document.getElementById('stackStatus').className = 'status-msg success';
        }

        function popPiring() {
            if (stackData.length === 0) {
                document.getElementById('stackStatus').textContent = '⚠️ Tumpukan kosong! Tidak ada piring yang bisa diambil.';
                document.getElementById('stackStatus').className = 'status-msg warning';
                return;
            }
            const container = document.getElementById('tumpukanPiring');
            const lastChild = container.lastElementChild;
            if (lastChild) {
                lastChild.classList.add('leaving');
            }
            const diambil = stackData.pop();
            setTimeout(() => {
                renderStack();
                document.getElementById('stackStatus').textContent =
                    `⬇️ POP: Piring #${diambil} diambil dari ATAS. (Yang terakhir masuk, pertama keluar!)`;
                document.getElementById('stackStatus').className = 'status-msg warning';
            }, 350);
        }

        function resetStack() {
            stackData = [];
            stackCounter = 1;
            renderStack();
            document.getElementById('stackStatus').textContent = '🔄 Tumpukan direset. Klik PUSH untuk mulai.';
            document.getElementById('stackStatus').className = 'status-msg info';
        }

        // ==================== QUEUE GAME ====================
        let queueData = [];
        let queueCounter = 1;
        const orangEmojis = ['🧑', '👩', '👦', '👧', '🧒', '👨', '👩‍🦰', '🧑‍🦱', '👴', '👵'];

        function renderQueue() {
            const area = document.getElementById('antrianArea');
            area.innerHTML = '';
            queueData.forEach((o, i) => {
                const div = document.createElement('div');
                div.className = 'orang-antri';
                div.textContent = o.emoji;
                div.title = o.nama;
                if (i === queueData.length - 1 && o._new) {
                    div.classList.add('entering');
                    setTimeout(() => { div.classList.remove('entering');
                        o._new = false; }, 400);
                }
                area.appendChild(div);
            });
            document.getElementById('queueStatus').textContent =
                queueData.length === 0 ?
                '🚶 Antrian kosong. Klik ENQUEUE untuk orang datang.' :
                `👥 ${queueData.length} orang mengantri. Paling depan: ${queueData[0].nama}.`;
            document.getElementById('queueStatus').className = queueData.length === 0 ? 'status-msg info' :
                'status-msg success';
        }

        function enqueueOrang() {
            const emoji = orangEmojis[Math.floor(Math.random() * orangEmojis.length)];
            const orang = { nama: 'Orang #' + queueCounter++, emoji: emoji, _new: true };
            queueData.push(orang);
            renderQueue();
            document.getElementById('queueStatus').textContent =
                `➕ ENQUEUE: ${orang.nama} datang dan berdiri di BELAKANG antrian. (FIFO!)`;
            document.getElementById('queueStatus').className = 'status-msg success';
        }

        function dequeueOrang() {
            if (queueData.length === 0) {
                document.getElementById('queueStatus').textContent =
                '⚠️ Antrian kosong! Tidak ada yang bisa dilayani.';
                document.getElementById('queueStatus').className = 'status-msg warning';
                return;
            }
            const area = document.getElementById('antrianArea');
            const firstChild = area.firstElementChild;
            if (firstChild) {
                firstChild.classList.add('leaving');
            }
            const dilayani = queueData.shift();
            setTimeout(() => {
                renderQueue();
                document.getElementById('queueStatus').textContent =
                    `✅ DEQUEUE: ${dilayani.nama} (paling depan) dilayani kasir. Yang pertama datang, pertama dilayani!`;
                document.getElementById('queueStatus').className = 'status-msg warning';
            }, 400);
        }

        function resetQueue() {
            queueData = [];
            queueCounter = 1;
            renderQueue();
            document.getElementById('queueStatus').textContent = '🔄 Antrian direset. Klik ENQUEUE untuk mulai.';
            document.getElementById('queueStatus').className = 'status-msg info';
        }

        // ==================== LIST GAME ====================
        let listData = ['Telur 🥚', 'Gula 🍬', 'Mentega 🧈'];

        function renderList() {
            const ul = document.getElementById('listBelanja');
            ul.innerHTML = '';
            listData.forEach((item, i) => {
                const li = document.createElement('li');
                li.className = 'list-item';
                li.innerHTML = `
                    <span><span class="item-num">${i+1}.</span> ${item}</span>
                    <button class="hapus-btn" onclick="hapusItemList(${i})" title="Hapus item ini">❌</button>
                `;
                ul.appendChild(li);
            });
            document.getElementById('listStatus').textContent =
                `📝 ${listData.length} item dalam daftar. Bisa tambah di akhir, sisipkan, atau hapus!`;
            document.getElementById('listStatus').className = 'status-msg info';
        }

        function tambahItemList(mode) {
            const input = document.getElementById('listInput');
            const nama = input.value.trim();
            if (!nama) {
                document.getElementById('listStatus').textContent = '⚠️ Isi nama item dulu ya!';
                document.getElementById('listStatus').className = 'status-msg warning';
                return;
            }
            if (mode === 'akhir') {
                listData.push(nama);
                document.getElementById('listStatus').textContent = `➕ "${nama}" ditambahkan di akhir daftar (posisi ${listData.length}).`;
            } else {
                const posInput = document.getElementById('listPosInput');
                let pos = parseInt(posInput.value);
                if (isNaN(pos) || pos < 1 || pos > listData.length + 1) {
                    document.getElementById('listStatus').textContent =
                        `⚠️ Posisi tidak valid! Masukkan angka 1 sampai ${listData.length+1}.`;
                    document.getElementById('listStatus').className = 'status-msg warning';
                    return;
                }
                listData.splice(pos - 1, 0, nama);
                document.getElementById('listStatus').textContent =
                `📌 "${nama}" disisipkan di posisi ${pos}. Item lain digeser.`;
            }
            document.getElementById('listStatus').className = 'status-msg success';
            input.value = '';
            document.getElementById('listPosInput').value = '';
            renderList();
        }

        function hapusItemList(index) {
            const dihapus = listData[index];
            listData.splice(index, 1);
            document.getElementById('listStatus').textContent = `❌ "${dihapus}" dihapus dari daftar.`;
            document.getElementById('listStatus').className = 'status-msg warning';
            renderList();
        }

        function resetList() {
            listData = ['Telur 🥚', 'Gula 🍬', 'Mentega 🧈'];
            document.getElementById('listInput').value = '';
            document.getElementById('listPosInput').value = '';
            document.getElementById('listStatus').textContent = '🔄 Daftar direset ke contoh awal.';
            document.getElementById('listStatus').className = 'status-msg info';
            renderList();
        }

        // ==================== LINEAR SEARCH ====================
        const tasBarang = [
            { nama: 'Buku 📘', isTarget: false },
            { nama: 'Dompet 👛', isTarget: false },
            { nama: 'Tempat Pensil ✏️', isTarget: false },
            { nama: 'Botol Minum 🧃', isTarget: false },
            { nama: 'Jaket 🧥', isTarget: false },
            { nama: 'Kunci Motor 🔑', isTarget: true },
            { nama: 'Snack 🍪', isTarget: false },
            { nama: 'Headset 🎧', isTarget: false },
        ];
        let linearChecked = [];
        let linearFound = false;
        let linearDone = false;

        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }
        let tasAcak = shuffleArray(tasBarang);

        function renderLinearSearch() {
            const area = document.getElementById('tasArea');
            area.innerHTML = '';
            tasAcak.forEach((barang, i) => {
                const div = document.createElement('div');
                div.className = 'barang-tas';
                div.textContent = barang.nama;
                div.id = 'barang-' + i;
                if (linearChecked.includes(i) && barang.isTarget && linearFound) {
                    div.classList.add('found');
                } else if (linearChecked.includes(i) && !barang.isTarget) {
                    div.classList.add('discarded');
                }
                area.appendChild(div);
            });
        }

        function linearSearchStep() {
            if (linearDone) {
                document.getElementById('linearStatus').textContent =
                '✅ Sudah ketemu! Klik "Acak Ulang Tas" untuk mencoba lagi.';
                document.getElementById('linearStatus').className = 'status-msg success';
                return;
            }
            const nextIdx = linearChecked.length;
            if (nextIdx >= tasAcak.length) {
                document.getElementById('linearStatus').textContent =
                '😅 Sudah dicek semua, Kunci Motor tidak ditemukan? (Seharusnya ada, coba reset)';
                document.getElementById('linearStatus').className = 'status-msg warning';
                linearDone = true;
                return;
            }
            const barang = tasAcak[nextIdx];
            linearChecked.push(nextIdx);
            renderLinearSearch();
            const div = document.getElementById('barang-' + nextIdx);
            if (div) {
                div.classList.add('checking');
                setTimeout(() => div.classList.remove('checking'), 500);
            }
            if (barang.isTarget) {
                linearFound = true;
                linearDone = true;
                document.getElementById('linearStatus').textContent =
                    `🎉 KETEMU! "${barang.nama}" ditemukan di urutan ke-${nextIdx + 1}! Setelah mengeluarkan ${nextIdx} barang lainnya.`;
                document.getElementById('linearStatus').className = 'status-msg success';
                setTimeout(() => renderLinearSearch(), 100);
                document.getElementById('btnLinearStep').textContent = '✅ Selesai';
            } else {
                document.getElementById('linearStatus').textContent =
                    `🔍 Cek urutan ke-${nextIdx + 1}: "${barang.nama}" — BUKAN Kunci Motor. Taruh di lantai, lanjut!`;
                document.getElementById('linearStatus').className = 'status-msg warning';
            }
        }

        function resetLinearSearch() {
            tasAcak = shuffleArray(tasBarang);
            linearChecked = [];
            linearFound = false;
            linearDone = false;
            document.getElementById('btnLinearStep').textContent = '👆 Cari Satu per Satu (Step)';
            document.getElementById('linearStatus').textContent =
            '🔍 Tas diacak ulang! Klik "Cari Satu per Satu" untuk mulai mencari Kunci Motor.';
            document.getElementById('linearStatus').className = 'status-msg info';
            renderLinearSearch();
        }

        // ==================== BINARY SEARCH ====================
        const binaryData = [];
        for (let i = 1; i <= 31; i++) binaryData.push(i);
        let binaryTarget = null;
        let binaryLow = 0;
        let binaryHigh = binaryData.length - 1;
        let binaryMid = null;
        let binaryFound = false;
        let binaryDone = false;
        let binaryHistory = [];

        function renderBinarySearch() {
            const area = document.getElementById('binaryArray');
            area.innerHTML = '';
            binaryData.forEach((val, i) => {
                const div = document.createElement('div');
                div.className = 'binary-cell';
                div.textContent = val;
                div.id = 'bcell-' + i;
                if (binaryFound && i === binaryMid && val === binaryTarget) {
                    div.classList.add('found-cell');
                } else if (binaryMid === i && !binaryFound && binaryLow <= binaryHigh) {
                    div.classList.add('mid');
                } else if (i >= binaryLow && i <= binaryHigh && binaryLow <= binaryHigh) {
                    div.classList.add('in-range');
                } else if (binaryLow > binaryHigh || binaryDone) {
                    // nothing
                } else if (i < binaryLow || i > binaryHigh) {
                    div.classList.add('out-range');
                }
                area.appendChild(div);
            });
        }

        function initBinarySearch() {
            const input = document.getElementById('binaryTarget');
            const target = parseInt(input.value);
            if (isNaN(target) || target < 1 || target > 31) {
                document.getElementById('binaryStatus').textContent =
                '⚠️ Masukkan angka target antara 1 sampai 31!';
                document.getElementById('binaryStatus').className = 'status-msg warning';
                return;
            }
            binaryTarget = target;
            binaryLow = 0;
            binaryHigh = binaryData.length - 1;
            binaryMid = null;
            binaryFound = false;
            binaryDone = false;
            binaryHistory = [];
            document.getElementById('btnBinaryStep').disabled = false;
            document.getElementById('btnBinaryStep').textContent = '📖 Langkah Berikutnya';
            document.getElementById('binaryStatus').textContent =
                `🎯 Target: ${binaryTarget}. Data terurut 1-31. Klik "Langkah Berikutnya" untuk mulai Binary Search!`;
            document.getElementById('binaryStatus').className = 'status-msg info';
            renderBinarySearch();
        }

        function binarySearchStep() {
            if (binaryTarget === null) {
                document.getElementById('binaryStatus').textContent =
                '⚠️ Set target dulu ya! Masukkan angka lalu klik "Set Target & Cari".';
                document.getElementById('binaryStatus').className = 'status-msg warning';
                return;
            }
            if (binaryDone) {
                document.getElementById('binaryStatus').textContent =
                    binaryFound ? '✅ Sudah ketemu! Klik Reset untuk mencoba lagi.' :
                    '😅 Pencarian selesai, target tidak ditemukan.';
                document.getElementById('binaryStatus').className = 'status-msg success';
                return;
            }
            if (binaryLow > binaryHigh) {
                binaryDone = true;
                document.getElementById('binaryStatus').textContent =
                    `😅 Rentang habis. Target ${binaryTarget} tidak ditemukan dalam data.`;
                document.getElementById('binaryStatus').className = 'status-msg warning';
                document.getElementById('btnBinaryStep').disabled = true;
                renderBinarySearch();
                return;
            }
            binaryMid = Math.floor((binaryLow + binaryHigh) / 2);
            const midVal = binaryData[binaryMid];
            binaryHistory.push({ low: binaryLow, high: binaryHigh, mid: binaryMid, val: midVal });
            renderBinarySearch();
            if (midVal === binaryTarget) {
                binaryFound = true;
                binaryDone = true;
                document.getElementById('binaryStatus').textContent =
                    `🎉 KETEMU! Target ${binaryTarget} ditemukan di indeks ${binaryMid} (nilai=${midVal}). Hanya butuh ${binaryHistory.length} langkah!`;
                document.getElementById('binaryStatus').className = 'status-msg success';
                document.getElementById('btnBinaryStep').textContent = '✅ Selesai';
                document.getElementById('btnBinaryStep').disabled = true;
                setTimeout(() => renderBinarySearch(), 100);
            } else if (midVal < binaryTarget) {
                document.getElementById('binaryStatus').textContent =
                    `📖 Langkah ${binaryHistory.length}: Tengah = ${midVal} (indeks ${binaryMid}). ${midVal} < ${binaryTarget} → BUANG bagian KIRI (1-${midVal}). Cari di KANAN.`;
                document.getElementById('binaryStatus').className = 'status-msg warning';
                binaryLow = binaryMid + 1;
            } else {
                document.getElementById('binaryStatus').textContent =
                    `📖 Langkah ${binaryHistory.length}: Tengah = ${midVal} (indeks ${binaryMid}). ${midVal} > ${binaryTarget} → BUANG bagian KANAN (${midVal}-${binaryData[binaryHigh]}). Cari di KIRI.`;
                document.getElementById('binaryStatus').className = 'status-msg warning';
                binaryHigh = binaryMid - 1;
            }
            setTimeout(() => renderBinarySearch(), 300);
        }

        function resetBinarySearch() {
            binaryTarget = null;
            binaryLow = 0;
            binaryHigh = binaryData.length - 1;
            binaryMid = null;
            binaryFound = false;
            binaryDone = false;
            binaryHistory = [];
            document.getElementById('btnBinaryStep').disabled = true;
            document.getElementById('btnBinaryStep').textContent = '📖 Langkah Berikutnya';
            document.getElementById('binaryTarget').value = '';
            document.getElementById('binaryStatus').textContent =
            '🎯 Masukkan target (1-31) dan klik "Set Target & Cari" untuk mulai.';
            document.getElementById('binaryStatus').className = 'status-msg info';
            renderBinarySearch();
        }

        // ==================== BUBBLE SORT ====================
        let bubbleArr = [7, 3, 9, 1, 5, 4];
        let bubbleI = 0;
        let bubbleJ = 0;
        let bubbleSorted = false;
        let bubbleAutoInterval = null;

        function renderBubbleSort() {
            const area = document.getElementById('bubbleBars');
            area.innerHTML = '';
            const maxVal = Math.max(...bubbleArr);
            bubbleArr.forEach((val, i) => {
                const div = document.createElement('div');
                div.className = 'sort-bar';
                div.style.height = (val / maxVal * 170) + 'px';
                div.style.background = getBarColor(val, maxVal);
                div.textContent = val;
                div.id = 'bubble-bar-' + i;
                const sortedCount = bubbleI;
                if (i >= bubbleArr.length - sortedCount && bubbleSorted) {
                    div.classList.add('sorted');
                }
                area.appendChild(div);
            });
        }

        function getBarColor(val, max) {
            const ratio = val / max;
            const colors = ['#3b82f6', '#6366f1', '#8b5cf6', '#a855f7', '#ec4899', '#f43f5e'];
            const idx = Math.min(Math.floor(ratio * colors.length), colors.length - 1);
            return colors[idx];
        }

        function bubbleSortStep() {
            if (bubbleSorted) {
                document.getElementById('bubbleStatus').textContent =
                '✅ Semua data sudah terurut! Klik "Acak Ulang" untuk mencoba lagi.';
                document.getElementById('bubbleStatus').className = 'status-msg success';
                return;
            }
            const n = bubbleArr.length;
            if (bubbleI >= n - 1) {
                bubbleSorted = true;
                document.getElementById('bubbleStatus').textContent =
                '🎉 Bubble Sort SELESAI! Semua data terurut dari kecil ke besar.';
                document.getElementById('bubbleStatus').className = 'status-msg success';
                document.getElementById('btnBubbleStep').textContent = '✅ Selesai';
                renderBubbleSort();
                setTimeout(() => {
                    document.querySelectorAll('#bubbleBars .sort-bar').forEach(b => b.classList.add('sorted'));
                }, 100);
                return;
            }
            const barA = document.getElementById('bubble-bar-' + bubbleJ);
            const barB = document.getElementById('bubble-bar-' + (bubbleJ + 1));
            if (barA) barA.classList.add('comparing');
            if (barB) barB.classList.add('comparing');
            setTimeout(() => {
                if (barA) barA.classList.remove('comparing');
                if (barB) barB.classList.remove('comparing');
            }, 500);

            if (bubbleArr[bubbleJ] > bubbleArr[bubbleJ + 1]) {
                [bubbleArr[bubbleJ], bubbleArr[bubbleJ + 1]] = [bubbleArr[bubbleJ + 1], bubbleArr[bubbleJ]];
                document.getElementById('bubbleStatus').textContent =
                    `🫧 Bandingkan indeks [${bubbleJ}]=${bubbleArr[bubbleJ+1]} vs [${bubbleJ+1}]=${bubbleArr[bubbleJ]} → TUKAR! (${bubbleArr[bubbleJ+1]} > ${bubbleArr[bubbleJ]})`;
                document.getElementById('bubbleStatus').className = 'status-msg warning';
                renderBubbleSort();
                setTimeout(() => {
                    const newA = document.getElementById('bubble-bar-' + bubbleJ);
                    const newB = document.getElementById('bubble-bar-' + (bubbleJ + 1));
                    if (newA) newA.classList.add('swapping');
                    if (newB) newB.classList.add('swapping');
                    setTimeout(() => {
                        if (newA) newA.classList.remove('swapping');
                        if (newB) newB.classList.remove('swapping');
                    }, 500);
                }, 50);
            } else {
                document.getElementById('bubbleStatus').textContent =
                    `🫧 Bandingkan [${bubbleJ}]=${bubbleArr[bubbleJ]} vs [${bubbleJ+1}]=${bubbleArr[bubbleJ+1]} → Tidak perlu tukar.`;
                document.getElementById('bubbleStatus').className = 'status-msg info';
            }
            bubbleJ++;
            const maxJ = n - bubbleI - 1;
            if (bubbleJ >= maxJ) {
                bubbleJ = 0;
                bubbleI++;
                document.getElementById('bubbleStatus').textContent +=
                    ` 🔝 Nilai terbesar sudah "menggelembung" ke posisi ${n-bubbleI}.`;
                setTimeout(() => renderBubbleSort(), 100);
            }
        }

        function bubbleSortAuto() {
            if (bubbleAutoInterval) {
                clearInterval(bubbleAutoInterval);
                bubbleAutoInterval = null;
                document.getElementById('btnBubbleAuto').textContent = '▶️ Auto Play';
                return;
            }
            document.getElementById('btnBubbleAuto').textContent = '⏸️ Stop';
            bubbleAutoInterval = setInterval(() => {
                if (bubbleSorted) {
                    clearInterval(bubbleAutoInterval);
                    bubbleAutoInterval = null;
                    document.getElementById('btnBubbleAuto').textContent = '▶️ Auto Play';
                    return;
                }
                bubbleSortStep();
            }, 700);
        }

        function resetBubbleSort() {
            if (bubbleAutoInterval) {
                clearInterval(bubbleAutoInterval);
                bubbleAutoInterval = null;
                document.getElementById('btnBubbleAuto').textContent = '▶️ Auto Play';
            }
            bubbleArr = shuffleArraySimple([7, 3, 9, 1, 5, 4, 8, 2, 6]);
            bubbleI = 0;
            bubbleJ = 0;
            bubbleSorted = false;
            document.getElementById('btnBubbleStep').textContent = '👆 Langkah Berikutnya';
            document.getElementById('bubbleStatus').textContent =
            '🫧 Data diacak ulang! Klik "Langkah" untuk melihat Bubble Sort.';
            document.getElementById('bubbleStatus').className = 'status-msg info';
            renderBubbleSort();
        }

        function shuffleArraySimple(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ==================== SELECTION SORT ====================
        let selectionArr = [7, 3, 9, 1, 5, 4];
        let selectionPos = 0;
        let selectionMinIdx = -1;
        let selectionScanIdx = -1;
        let selectionSorted = false;
        let selectionAutoInterval = null;
        let selectionPhase = 'find';

        function renderSelectionSort() {
            const area = document.getElementById('selectionBars');
            area.innerHTML = '';
            const maxVal = Math.max(...selectionArr);
            selectionArr.forEach((val, i) => {
                const div = document.createElement('div');
                div.className = 'sort-bar';
                div.style.height = (val / maxVal * 170) + 'px';
                div.style.background = getBarColor(val, maxVal);
                div.textContent = val;
                div.id = 'sel-bar-' + i;
                if (i < selectionPos && selectionSorted) {
                    div.classList.add('sorted');
                }
                area.appendChild(div);
            });
            if (selectionScanIdx >= 0 && selectionPhase === 'find') {
                const scanBar = document.getElementById('sel-bar-' + selectionScanIdx);
                if (scanBar) scanBar.classList.add('comparing');
            }
            if (selectionMinIdx >= 0 && selectionPhase === 'swap') {
                const minBar = document.getElementById('sel-bar-' + selectionMinIdx);
                if (minBar) {
                    minBar.classList.add('comparing');
                    minBar.style.background = '#f59e0b';
                }
            }
        }

        function selectionSortStep() {
            if (selectionSorted) {
                document.getElementById('selectionStatus').textContent =
                '✅ Semua data sudah terurut! Klik "Acak Ulang" untuk mencoba lagi.';
                document.getElementById('selectionStatus').className = 'status-msg success';
                return;
            }
            const n = selectionArr.length;
            if (selectionPos >= n - 1) {
                selectionSorted = true;
                document.getElementById('selectionStatus').textContent =
                '🎉 Selection Sort SELESAI! Semua terurut dari kecil ke besar.';
                document.getElementById('selectionStatus').className = 'status-msg success';
                document.getElementById('btnSelectionStep').textContent = '✅ Selesai';
                renderSelectionSort();
                setTimeout(() => {
                    document.querySelectorAll('#selectionBars .sort-bar').forEach(b => b.classList.add(
                        'sorted'));
                }, 100);
                return;
            }
            if (selectionPhase === 'find') {
                if (selectionScanIdx < selectionPos) selectionScanIdx = selectionPos;
                if (selectionScanIdx === selectionPos) {
                    selectionMinIdx = selectionPos;
                    selectionScanIdx = selectionPos + 1;
                    document.getElementById('selectionStatus').textContent =
                        `🃏 Mulai dari posisi ${selectionPos}. Mencari nilai terkecil...`;
                    document.getElementById('selectionStatus').className = 'status-msg info';
                    renderSelectionSort();
                    return;
                }
                if (selectionScanIdx < n) {
                    document.getElementById('selectionStatus').textContent =
                        `🔍 Memindai indeks [${selectionScanIdx}]=${selectionArr[selectionScanIdx]}, bandingkan dengan min sementara [${selectionMinIdx}]=${selectionArr[selectionMinIdx]}.`;
                    document.getElementById('selectionStatus').className = 'status-msg info';
                    if (selectionArr[selectionScanIdx] < selectionArr[selectionMinIdx]) {
                        selectionMinIdx = selectionScanIdx;
                        document.getElementById('selectionStatus').textContent +=
                            ` ⬅️ Nilai lebih kecil ditemukan! Min baru di indeks ${selectionMinIdx}.`;
                    }
                    selectionScanIdx++;
                    renderSelectionSort();
                } else {
                    selectionPhase = 'swap';
                    document.getElementById('selectionStatus').textContent =
                        `🎯 Nilai terkecil ditemukan: ${selectionArr[selectionMinIdx]} di indeks ${selectionMinIdx}. Siap ditukar dengan posisi ${selectionPos}. Klik Langkah lagi untuk menukar.`;
                    document.getElementById('selectionStatus').className = 'status-msg warning';
                    renderSelectionSort();
                }
            } else if (selectionPhase === 'swap') {
                if (selectionMinIdx !== selectionPos) {
                    [selectionArr[selectionPos], selectionArr[selectionMinIdx]] = [selectionArr[selectionMinIdx],
                        selectionArr[selectionPos]
                    ];
                    document.getElementById('selectionStatus').textContent =
                        `🔄 TUKAR! Posisi [${selectionPos}]=${selectionArr[selectionPos]} ditukar dengan [${selectionMinIdx}]=${selectionArr[selectionMinIdx]}.`;
                } else {
                    document.getElementById('selectionStatus').textContent =
                        `✅ Nilai terkecil sudah di posisi ${selectionPos}, tidak perlu tukar.`;
                }
                document.getElementById('selectionStatus').className = 'status-msg success';
                selectionPos++;
                selectionMinIdx = -1;
                selectionScanIdx = selectionPos;
                selectionPhase = 'find';
                renderSelectionSort();
                setTimeout(() => renderSelectionSort(), 300);
            }
        }

        function selectionSortAuto() {
            if (selectionAutoInterval) {
                clearInterval(selectionAutoInterval);
                selectionAutoInterval = null;
                document.getElementById('btnSelectionAuto').textContent = '▶️ Auto Play';
                return;
            }
            document.getElementById('btnSelectionAuto').textContent = '⏸️ Stop';
            selectionAutoInterval = setInterval(() => {
                if (selectionSorted) {
                    clearInterval(selectionAutoInterval);
                    selectionAutoInterval = null;
                    document.getElementById('btnSelectionAuto').textContent = '▶️ Auto Play';
                    return;
                }
                selectionSortStep();
            }, 750);
        }

        function resetSelectionSort() {
            if (selectionAutoInterval) {
                clearInterval(selectionAutoInterval);
                selectionAutoInterval = null;
                document.getElementById('btnSelectionAuto').textContent = '▶️ Auto Play';
            }
            selectionArr = shuffleArraySimple([7, 3, 9, 1, 5, 4, 8, 2]);
            selectionPos = 0;
            selectionMinIdx = -1;
            selectionScanIdx = 0;
            selectionSorted = false;
            selectionPhase = 'find';
            document.getElementById('btnSelectionStep').textContent = '👆 Langkah Berikutnya';
            document.getElementById('selectionStatus').textContent =
            '🃏 Data diacak ulang! Klik "Langkah" untuk melihat Selection Sort.';
            document.getElementById('selectionStatus').className = 'status-msg info';
            renderSelectionSort();
        }

        // ==================== INITIALIZATION ====================
        function initAll() {
            renderArray();
            renderStack();
            renderQueue();
            renderList();
            renderLinearSearch();
            renderBinarySearch();
            renderBubbleSort();
            renderSelectionSort();
            document.getElementById('btnBinaryStep').disabled = true;
        }

        document.getElementById('listInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') tambahItemList('akhir');
        });

        initAll();
        console.log('🎮 Game Struktur Data & Algoritma siap!');
    </script>
</body>
</html>

    <script>
        (function() {
            const STORAGE_KEY = 'lkpd_v1_answers';
            const AUTO_SAVE_DELAY = 600;
            let saveTimeout = null;
            const indicator = document.getElementById('autoSaveIndicator');

            function getAllInputs() {
                const inputs = document.querySelectorAll('input[data-save], textarea[data-save]');
                const radios = document.querySelectorAll('input[type="radio"][data-save]');
                return { inputs, radios };
            }

            function collectAllData() {
                const data = {};
                const { inputs } = getAllInputs();
                inputs.forEach(inp => { data[inp.id] = inp.value; });
                const radioNames = new Set();
                document.querySelectorAll('input[type="radio"][data-save]').forEach(r => radioNames.add(r.name));
                radioNames.forEach(name => {
                    const checked = document.querySelector(`input[name="${name}"]:checked`);
                    data['radio_' + name] = checked ? checked.value : '';
                });
                data['nama1'] = document.getElementById('nama1')?.value || '';
                data['nama2'] = document.getElementById('nama2')?.value || '';
                data['kelas'] = document.getElementById('kelas')?.value || '';
                data['tanggal'] = document.getElementById('tanggal')?.value || '';
                return data;
            }

            function saveToLocalStorage() {
                try {
                    const data = collectAllData();
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                    if (indicator) {
                        indicator.textContent = '✅ Tersimpan · ' + new Date().toLocaleTimeString('id-ID');
                        indicator.classList.add('saved');
                        setTimeout(() => {
                            indicator.textContent = '💾 Jawaban tersimpan otomatis di browser';
                            indicator.classList.remove('saved');
                        }, 2000);
                    }
                } catch (e) { console.warn('Save failed:', e); }
            }

            function restoreFromLocalStorage() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return;
                    const data = JSON.parse(raw);
                    for (const [key, value] of Object.entries(data)) {
                        if (key.startsWith('radio_')) continue;
                        if (key.startsWith('nama') || key === 'kelas' || key === 'tanggal') continue;
                        const el = document.getElementById(key);
                        if (el) el.value = value;
                    }
                    for (const [key, value] of Object.entries(data)) {
                        if (key.startsWith('radio_')) {
                            const name = key.replace('radio_', '');
                            if (value) {
                                const radio = document.querySelector(`input[name="${name}"][value="${value}"]`);
                                if (radio) radio.checked = true;
                            }
                        }
                    }
                    if (data['nama1']) document.getElementById('nama1').value = data['nama1'];
                    if (data['nama2']) document.getElementById('nama2').value = data['nama2'];
                    if (data['kelas']) document.getElementById('kelas').value = data['kelas'];
                    if (data['tanggal']) document.getElementById('tanggal').value = data['tanggal'];
                } catch (e) { console.warn('Restore failed:', e); }
            }

            function debouncedSave() {
                if (saveTimeout) clearTimeout(saveTimeout);
                saveTimeout = setTimeout(saveToLocalStorage, AUTO_SAVE_DELAY);
            }

            function attachAutoSaveListeners() {
                const { inputs, radios } = getAllInputs();
                inputs.forEach(inp => {
                    inp.addEventListener('input', debouncedSave);
                    inp.addEventListener('change', debouncedSave);
                });
                radios.forEach(radio => { radio.addEventListener('change', debouncedSave); });
                ['nama1', 'nama2', 'kelas', 'tanggal'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.addEventListener('input', debouncedSave);
                        el.addEventListener('change', debouncedSave);
                    }
                });
            }

            function showToast(message, type = 'info') {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = 'toast ' + type + ' show';
                clearTimeout(toast._hideTimeout);
                toast._hideTimeout = setTimeout(() => { toast.classList.remove('show'); }, 2200);
            }

            function escapeHTML(str) {
                if (!str) return '';
                return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }

            function downloadWord() {
                const data = collectAllData();
                const nama1 = data['nama1'] || '.......................................';
                const nama2 = data['nama2'] || '.......................................';
                const kelas = data['kelas'] || '.......................................';
                const tanggal = data['tanggal'] || '.......................................';
                function val(id) { return (data[id] !== undefined && data[id] !== '') ? data[id] : '.......................................'; }
                function radioVal(name) {
                    const key = 'radio_' + name;
                    return (data[key] && data[key] !== '') ? data[key] : '.......................................';
                }

                const wordHTML = `
            <html xmlns:o="urn:schemas-microsoft-com:office:office"
                  xmlns:w="urn:schemas-microsoft-com:office:word"

                .subtitle { text-align: center; font-size: 10pt; color: #666; margin-bottom: 18px; }

                table.identity td { padding: 8px 12px; border: 1px solid #ddd; font-size: 10pt; }

                h3 { font-size: 11pt; color: #444; margin-top: 14px; margin-bottom: 6px; }

                .q-story { font-style: italic; color: #5a5a5a; font-size: 10pt; margin-bottom: 6px; border-left: 3px solid #e0c040; padding-left: 10px; }
                .q-title { font-weight: bold; font-size: 10.5pt; margin-bottom: 4px; }
                .answer-block { display: inline; background: #fffde7; padding: 2px 8px; border-bottom: 1px dashed #999; }
                @page { size: A4; margin: 1.5cm; }

                <h2>Bagian A: Struktur Data</h2>
                <h3>1. Array (Rak Sepatu)</h3>

                    <p class="q-title">a. Slot sepatu olahraga:</p>
                    <p>Jawaban: <span class="answer-block">Slot nomor ${escapeHTML(val('q1a'))}</span></p>

                    <p>Jawaban: <span class="answer-block">${escapeHTML(val('q1b'))}</span></p>

                <h3>2. Stack (Tumpukan Buku)</h3>
                <div class="q-block">
                    <p class="q-story">Tumpukan dari bawah: Buku A, B, C. Hanya boleh ambil dari atas.</p>
