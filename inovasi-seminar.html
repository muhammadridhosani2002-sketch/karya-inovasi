            { q: "Perhatikan ilustrasi berikut!<br><br>Di sebuah lemari es, Ibu menyimpan stok sayuran:<br><ul class='list-disc ml-5 mt-2 mb-2'><li>Hari Senin: beli wortel, taruh di rak paling bawah</li><li>Hari Selasa: beli bayam, taruh di rak tengah</li><li>Hari Rabu: beli kangkung, taruh di rak paling atas</li></ul>Ketika Ibu mau memasak, ia mengambil sayuran yang paling mudah dijangkau yaitu yang ada di rak paling atas.<br><br>Ilustrasi di atas memiliki kemiripan dengan konsep struktur data...", options: { A: "Array, karena sayuran disimpan di rak", B: "Stack, karena yang terakhir masuk diambil pertama", C: "Queue, karena sayuran diambil sesuai urutan beli", D: "List, karena sayuran bisa ditambah kapan saja" }, correct: "B" }
        ];

        let currentStudent = { name: '', class: '' };
        let answeredQuestions = new Set();

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';
            quizData.forEach((q, index) => {
                const qNum = index + 1;
                let html = `
                    <div class="bg-gray-50 rounded-xl p-5 md:p-6 border border-gray-200">
                        <div class="flex items-start gap-4 mb-4">
                            <div class="bg-blue-100 text-blue-700 font-bold rounded-lg w-10 h-10 flex items-center justify-center shrink-0">
                                ${qNum}
                            </div>
                            <div class="text-gray-800 font-medium leading-relaxed mt-1">${q.q}</div>
                        </div>
                        <div class="space-y-3 pl-0 md:pl-14">
                `;
                for (const [key, value] of Object.entries(q.options)) {
                    html += `
                        <label class="relative block cursor-pointer group">
                            <input type="radio" name="q${index}" value="${key}" class="radio-custom sr-only" onchange="updateProgress(${index})">
                            <div class="flex items-center gap-4 p-4 rounded-lg border-2 border-gray-200 bg-white group-hover:border-blue-300 transition-colors">
                                <div class="circle w-5 h-5 rounded-full border-2 border-gray-300 relative shrink-0 transition-colors"></div>
                                <span class="font-bold text-gray-500 w-5">${key}.</span>
                                <span class="text-gray-700">${value}</span>
                            </div>
                        </label>
                    `;
                }
                html += `</div></div>`;
                container.innerHTML += html;
            });
        }

        function updateProgress(index) {
            answeredQuestions.add(index);
            const total = quizData.length;
            const answered = answeredQuestions.size;
            document.getElementById('progress-text').innerText = `${answered} / ${total} Terjawab`;
            const btnSubmit = document.getElementById('btn-submit');
            if (answered === total) {
                btnSubmit.disabled = false;
                btnSubmit.classList.remove('opacity-50', 'cursor-not-allowed');
                btnSubmit.classList.add('animate-pulse');
                setTimeout(() => btnSubmit.classList.remove('animate-pulse'), 1000);
            }
        }

        function startQuiz(e) {
            e.preventDefault();
            const nameInput = document.getElementById('studentName').value.trim();
            const classInput = document.getElementById('studentClass').value;
            if (nameInput && classInput) {
                currentStudent.name = nameInput;
                currentStudent.class = classInput;
                document.getElementById('quiz-identity-display').innerText = `${nameInput} - ${classInput}`;
                document.getElementById('intro-screen').classList.add('hidden');
                document.getElementById('quiz-screen').classList.remove('hidden');
                renderQuestions();
                window.scrollTo(0, 0);
            }
        }

        function submitQuiz() {
            if (answeredQuestions.size < quizData.length) {
                alert("Harap jawab semua pertanyaan terlebih dahulu.");
                return;
            }
            let score = 0;
            quizData.forEach((q, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                if (selected && selected.value === q.correct) score += 10;
            });
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('result-identity').innerText = `${currentStudent.name} (${currentStudent.class})`;
            animateValue("final-score", 0, score, 1500);
            document.getElementById('pdf-name').innerText = currentStudent.name;
            document.getElementById('pdf-class').innerText = currentStudent.class;
            document.getElementById('pdf-score').innerText = score;
            const now = new Date();
            const options = { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            document.getElementById('pdf-date').innerText = now.toLocaleDateString('id-ID', options) + ' WIB';
            window.scrollTo(0, 0);
        }

        function animateValue(id, start, end, duration) {
            if (start === end) return;
            const obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }

        function downloadPDF() {
            const pdfContainer = document.getElementById('pdf-container');
            const resultScreen = document.getElementById('result-screen');
            const overlay = document.getElementById('loading-overlay');
            const fileName = `Nilai_Kuis_${currentStudent.class.replace(/\s+/g, '_')}_${currentStudent.name.replace(/\s+/g, '_')}.pdf`;
            const opt = {
                margin: [0.5, 0.5, 0.5, 0.5],
                filename: fileName,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, logging: false },
                jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
            };
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            resultScreen.classList.add('hidden');
            pdfContainer.style.display = 'block';
            setTimeout(() => {
                html2pdf().set(opt).from(pdfContainer).save().then(() => {
                    pdfContainer.style.display = 'none';
                    resultScreen.classList.remove('hidden');
                    overlay.classList.add('hidden');
                    overlay.classList.remove('flex');
                }).catch(err => {
                    console.error("PDF generation failed:", err);
                    pdfContainer.style.display = 'none';
                    resultScreen.classList.remove('hidden');
                    overlay.classList.add('hidden');
                    overlay.classList.remove('flex');
                    alert("Gagal membuat PDF. Silakan coba lagi.");
                });
            }, 500);
        }

        window.startQuiz = startQuiz;
        window.updateProgress = updateProgress;
        window.submitQuiz = submitQuiz;
        window.downloadPDF = downloadPDF;
    </script>
</body>
</html>
    </template>

    <!-- ===== SCRIPT TO LOAD IFRAMES ===== -->
    <script>
        (function() {
            ['game', 'lkpd', 'quiz'].forEach(function(name) {
                var tpl = document.getElementById('tpl-' + name);
                var iframe = document.getElementById('iframe-' + name);
                if (tpl && iframe) {
                    iframe.srcdoc = '<!DOCTYPE html>' + tpl.innerHTML;
                }
            });

            // Tab switching
            var tabs = document.querySelectorAll('.main-tab');
            var pages = document.querySelectorAll('.page');
            tabs.forEach(function(tab) {
                tab.addEventListener('click', function() {
                    var target = tab.dataset.page;
                    tabs.forEach(function(t) { t.classList.toggle('active', t === tab); });
                    pages.forEach(function(p) { p.classList.toggle('active', p.id === 'page-' + target); });
                });
            });

            console.log('✅ Media Pembelajaran Gabungan siap!');
            console.log('📚 3 Halaman: Media Pembelajaran (8 topik) | LKPD | Kuis');
        })();
    </script>
